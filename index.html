<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KBÜ Not Hesaplayıcı</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="hesaplayici">
        <header>
            <h1>KBÜ Not Hesaplayıcı</h1>
            <p>Karabük Üniversitesi Ders Başarısına Göre Not Hesaplama</p>
        </header>

        <form id="hesaplayici" novalidate>
            <div class="form-satiri secim-satiri">
                <input type="checkbox" id="devamsizlik">
                <label for="devamsizlik">Devamsızım (F1)</label>
            </div>
            <div class="form-satiri">
                <label for="sinav-durumu">Genel / Bütünleme Sınavına Girdiniz mi?</label>
                <select id="sinav-durumu">
                    <option value="evet">Evet</option>
                    <option value="hayir">Hayır (F2)</option>
                </select>
            </div>
            <div class="form-satiri">
                <label for="vize-notu">Yıl İçi / Vize Notu (0-100):</label>
                <input type="number" id="vize-notu" min="0" max="100" placeholder="Örn: 70" step="any">
            </div>
            <div class="form-satiri">
                <label for="final-notu">Final Notu (0-100):</label>
                <input type="number" id="final-notu" min="0" max="100" placeholder="Örn: 60" step="any">
            </div>
            <div class="form-satiri">
                <label for="butunleme-notu">Bütünleme Notu (Opsiyonel):</label>
                <input type="number" id="butunleme-notu" min="0" max="100" placeholder="Girilirse final yerine geçer" step="any">
            </div>
            <div class="buton-satiri">
                <button type="submit" id="btn-hesapla">Hesapla</button>
                <button type="button" id="btn-sifirla">Sıfırla</button>
            </div>
        </form>

        <div id="hata-mesaji" class="hata-mesaji" style="display: none;"></div>

        <div id="sonuc-alani" class="sonuc-alani" style="display: none;">
            <h2>Hesaplama Sonucu</h2>
            <div class="sonuc-satiri">
                <span>Başarı Notu:</span>
                <strong id="sonuc-basari">-</strong>
            </div>
            <div class="sonuc-satiri">
                <span>Harf Notu:</span>
                <strong id="sonuc-harf">-</strong>
            </div>
            <div class="sonuc-satiri">
                <span>Durum:</span>
                <strong id="sonuc-durum">-</strong>
            </div>
            <div class="sonuc-satiri aciklama">
                <span>Açıklama:</span>
                <p id="sonuc-aciklama">-</p>
            </div>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
